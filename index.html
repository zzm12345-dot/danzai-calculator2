<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蛋仔派对充值折扣计算器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.1);
      --blue: #007aff;
      --blue-soft: rgba(0, 122, 255, 0.12);
      --green: #34c759;
      --red: #ff3b30;
      --gray: #8e8e93;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.12);
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(0, 122, 255, 0.16), transparent 30%),
        radial-gradient(circle at 86% 4%, rgba(52, 199, 89, 0.13), transparent 26%),
        var(--bg);
      color: var(--text);
      padding: 32px;
      letter-spacing: 0;
    }

    .container {
      width: min(1040px, 100%);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      overflow: hidden;
    }

    .content {
      padding: 42px;
    }

    h1 {
      color: var(--text);
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
      margin-bottom: 9px;
    }

    .radio-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .radio-option {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 10px 14px;
      background: rgba(118, 118, 128, 0.08);
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .radio-option:hover {
      background: rgba(118, 118, 128, 0.13);
      transform: translateY(-1px);
    }

    .radio-option input[type="radio"] {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      accent-color: var(--blue);
    }

    .radio-option:has(input[type="radio"]:checked) {
      background: var(--blue-soft);
      border-color: rgba(0, 122, 255, 0.28);
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 16px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.88);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: rgba(0, 122, 255, 0.65);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.14);
    }

    .btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      border-radius: 15px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 122, 255, 0.24);
    }

    .btn:hover {
      background: #0a84ff;
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0, 122, 255, 0.3);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(0, 122, 255, 0.2);
    }

    .btn-secondary {
      background: rgba(118, 118, 128, 0.16);
      color: var(--text);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(118, 118, 128, 0.22);
      box-shadow: none;
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .custom-plan-inputs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 9px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .results {
      margin-top: 26px;
      padding: 22px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s ease;
    }

    .results.show {
      opacity: 1;
      transform: translateY(0);
    }

    .result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .result-item:first-child {
      padding-top: 0;
    }

    .result-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .result-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .result-value {
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      text-align: right;
    }

    .profit-positive,
    .option-details .value.positive {
      color: var(--green) !important;
    }

    .profit-negative,
    .option-details .value.negative {
      color: var(--red) !important;
    }

    .profit-zero,
    .option-details .value.zero {
      color: var(--gray) !important;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(245, 245, 247, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      width: min(820px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      background: var(--panel-strong);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
      transform: scale(0.98) translateY(10px);
      transition: transform 0.25s ease;
    }

    .modal.show .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 22px 26px;
      background: rgba(255, 255, 255, 0.86);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .modal-header h3 {
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
    }

    .modal-close {
      position: absolute;
      top: 17px;
      right: 18px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: rgba(118, 118, 128, 0.14);
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-close:hover {
      color: var(--text);
      background: rgba(118, 118, 128, 0.22);
    }

    .modal-body {
      padding: 24px 26px 28px;
    }

    .modal-footer {
      display: none;
    }

    .option-card {
      margin-bottom: 18px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 18px;
    }

    .option-header {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .option-header .rank {
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
    }

    .option-details {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .option-details p {
      margin: 7px 0;
    }

    .option-details .value {
      color: var(--text);
      font-weight: 700;
    }

    .recharge-type {
      color: var(--blue);
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px !important;
    }

    .combination-steps {
      margin: 18px 0;
      padding: 16px;
      background: rgba(0, 122, 255, 0.08);
      border-radius: 18px;
    }

    .combination-steps h4 {
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .steps-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .step-item {
      padding: 14px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 14px;
    }

    .step-item h5 {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .step-item p {
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0;
    }

    @media (max-width: 768px) {
      body {
        padding: 14px;
      }

      .container {
        min-height: calc(100vh - 28px);
        border-radius: 22px;
      }

      .content {
        padding: 26px 18px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 24px;
      }

      .form-grid,
      .button-group,
      .custom-plan-inputs {
        grid-template-columns: 1fr;
      }

      .radio-group {
        grid-template-columns: 1fr;
      }

      .result-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .result-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <main class="content">
      <div id="coupon-tab">
        <h1>优惠券分析</h1>

        <div class="form-grid">
          <div class="form-group">
            <label>选择日期类型</label>
            <div class="radio-group">
              <div class="radio-option">
                <input type="radio" id="couponRebate" name="couponDayType" value="rebate" checked>
                <label for="couponRebate">返利日</label>
              </div>
              <div class="radio-option">
                <input type="radio" id="couponNormal" name="couponDayType" value="normal">
                <label for="couponNormal">非返利日</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>优惠券类型</label>
            <div class="radio-group">
              <div class="radio-option">
                <input type="radio" id="discountCoupon" name="couponType" value="discount" checked>
                <label for="discountCoupon">折扣券</label>
              </div>
              <div class="radio-option">
                <input type="radio" id="fixedCoupon" name="couponType" value="fixed">
                <label for="fixedCoupon">金额券</label>
              </div>
            </div>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group" id="discountInput">
            <label for="couponDiscount">优惠券折扣（如 0.7 表示 7 折）</label>
            <input type="number" id="couponDiscount" placeholder="例如：0.7" step="0.01">
          </div>
          <div class="form-group" id="couponAmountInput">
            <label for="couponAmount">可抵金额（元）</label>
            <input type="number" id="couponAmount" placeholder="例如：10" step="0.01">
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group" id="fixedInput" style="display: none;">
            <label for="minAmount">使用门槛（元）</label>
            <input type="number" id="minAmount" placeholder="例如：328" step="0.01">
            <label for="fixedAmount" style="margin-top: 14px;">优惠金额（元）</label>
            <input type="number" id="fixedAmount" placeholder="例如：100" step="0.01">
          </div>
          <div class="form-group" id="useTypeInput">
            <label>优惠券使用次数</label>
            <div class="radio-group">
              <div class="radio-option">
                <input type="radio" id="multipleUse" name="useType" value="multiple" checked>
                <label for="multipleUse">多次使用</label>
              </div>
              <div class="radio-option">
                <input type="radio" id="singleUse" name="useType" value="single">
                <label for="singleUse">单次使用</label>
              </div>
            </div>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="analysisEggRate">蛋币折算比例（元/蛋币）</label>
            <input type="number" id="analysisEggRate" value="0.075" placeholder="例如：0.075" step="0.001">
          </div>
          <div class="form-group">
            <label for="analysisCouponRate">无门槛优惠券折算比例（元/张）</label>
            <input type="number" id="analysisCouponRate" value="0.7" placeholder="例如：0.7" step="0.01">
          </div>
        </div>

        <div class="form-group">
          <label>自定义充值方案</label>
          <div class="custom-plan-inputs">
            <input type="number" id="customPlan1" placeholder="充值金额 1（元）" step="0.01">
            <input type="number" id="customPlan2" placeholder="充值金额 2（元）" step="0.01">
            <input type="number" id="customPlan3" placeholder="充值金额 3（元）" step="0.01">
          </div>
          <p class="hint">填写充值金额，留空表示不使用该位置。</p>
        </div>

        <div class="button-group">
          <button class="btn" onclick="analyzeCoupon()">分析最优充值方案</button>
          <button class="btn btn-secondary" onclick="calculateCustomPlan()">计算自定义方案</button>
        </div>

        <div class="results" id="couponResults">
          <div class="result-item">
            <div class="result-label">获得蛋币</div>
            <div class="result-value" id="couponEggCoins">-</div>
          </div>
          <div class="result-item" id="couponCouponItem">
            <div class="result-label">无门槛优惠券</div>
            <div class="result-value" id="couponCoupons">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">兑换后总金额（元）</div>
            <div class="result-value" id="couponTotalReturn">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">预估利润（元）</div>
            <div class="result-value" id="couponProfit">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">折扣</div>
            <div class="result-value" id="couponResultDiscount">-</div>
          </div>
          <div class="result-item">
            <div class="result-label">实际折扣</div>
            <div class="result-value" id="couponActualDiscount">-</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const rechargeTiers = [
      { amount: 30, eggCoins: 318 },
      { amount: 68, eggCoins: 725 },
      { amount: 128, eggCoins: 1368 },
      { amount: 198, eggCoins: 2118 },
      { amount: 328, eggCoins: 3548 },
      { amount: 648, eggCoins: 7068 }
    ];
    // 优惠券类型切换
    document.querySelectorAll('input[name="couponType"]').forEach(radio => {
      radio.addEventListener('change', function () {
        if (this.value === 'discount') {
          document.getElementById('discountInput').style.display = 'block';
          document.getElementById('fixedInput').style.display = 'none';
          document.getElementById('useTypeInput').style.display = 'block';
          document.getElementById('couponAmountInput').style.display = 'block';
        } else {
          document.getElementById('discountInput').style.display = 'none';
          document.getElementById('fixedInput').style.display = 'block';
          document.getElementById('useTypeInput').style.display = 'none';
          document.getElementById('couponAmountInput').style.display = 'none';
        }
      });
    });

    function getEggCoins(rechargeAmount) {
      for (let i = rechargeTiers.length - 1; i >= 0; i--) {
        if (rechargeAmount >= rechargeTiers[i].amount) {
          return rechargeTiers[i].eggCoins;
        }
      }
      return 0;
    }

    function getCoupons(actualPayment, isRebateDay) {
      if (!isRebateDay) return 0;

      let rate = 0;
      if (actualPayment >= 30 && actualPayment <= 127) {
        rate = 0.10;
      } else if (actualPayment >= 128 && actualPayment <= 327) {
        rate = 0.15;
      } else if (actualPayment >= 328 && actualPayment <= 647) {
        rate = 0.20;
      } else if (actualPayment >= 648) {
        rate = 0.25;
      }

      const couponValue = actualPayment * rate;
      return Math.ceil(couponValue);
    }

    function getAnalysisRates() {
      const eggRate = parseFloat(document.getElementById('analysisEggRate').value);
      const couponRate = parseFloat(document.getElementById('analysisCouponRate').value);

      if (isNaN(eggRate) || eggRate < 0) {
        alert('请输入有效的蛋币折算比例');
        return null;
      }

      if (isNaN(couponRate) || couponRate < 0) {
        alert('请输入有效的无门槛优惠券折算比例');
        return null;
      }

      return { eggRate, couponRate };
    }

    function analyzeCoupon() {
      try {
        const couponType = document.querySelector('input[name="couponType"]:checked').value;
        let useType = 'multiple';
        let couponAmount = 0;
        const dayType = document.querySelector('input[name="couponDayType"]:checked').value;
        const isRebateDay = dayType === 'rebate';

        let couponDiscount = 0;
        let fixedAmount = 0;
        let minAmount = 0;

        if (couponType === 'discount') {
          useType = document.querySelector('input[name="useType"]:checked').value;
          couponAmount = parseFloat(document.getElementById('couponAmount').value) || 0;
          couponDiscount = parseFloat(document.getElementById('couponDiscount').value) || 0;
          if (isNaN(couponDiscount)) {
            alert('请输入有效的折扣值');
            return;
          }
          if (couponDiscount >= 1) {
            alert('优惠券折扣必须小于1，例如75折应输入0.75');
            return;
          }
          if (couponDiscount <= 0) {
            alert('优惠券折扣必须大于0');
            return;
          }
          if (couponAmount < 0) {
            alert('可抵金额必须大于等于0');
            return;
          }
        } else {
          // 金额券：优惠金额就是可抵金额，强制单次使用
          useType = 'single';
          minAmount = parseFloat(document.getElementById('minAmount').value) || 0;
          fixedAmount = parseFloat(document.getElementById('fixedAmount').value) || 0;
          couponAmount = fixedAmount; // 优惠金额就是可抵金额
          if (isNaN(minAmount)) {
            alert('请输入有效的使用门槛');
            return;
          }
          if (minAmount <= 0) {
            alert('使用门槛必须大于0');
            return;
          }
          if (isNaN(fixedAmount)) {
            alert('请输入有效的优惠金额');
            return;
          }
          if (fixedAmount <= 0) {
            alert('优惠金额必须大于0');
            return;
          }
        }

        console.log('优惠券类型:', couponType);
        console.log('使用类型:', useType);
        console.log('可抵金额:', couponAmount);
        if (couponType === 'discount') {
          console.log('优惠券折扣:', couponDiscount);
        } else {
          console.log('使用门槛:', minAmount);
          console.log('优惠金额:', fixedAmount);
        }

        const rates = getAnalysisRates();
        if (!rates) return;
        const defaultEggRate = rates.eggRate;
        const defaultCouponRate = rates.couponRate;

        // 分析所有充值档位和可能的组合
        let bestProfitOption = null;
        let bestDiscountOption = null;
        let maxProfit = -Infinity;
        let bestDiscount = Infinity; // 折扣越小越好

        // 分析单个充值档位
        for (const tier of rechargeTiers) {
          // 计算使用优惠券后的实际付款金额
          const originalAmount = tier.amount;
          let remainingCouponAmount = couponAmount;
          let actualDiscount = 0;
          let actualPayment = originalAmount;

          if (couponType === 'discount') {
            // 折扣券计算
            const discountAmount = originalAmount * (1 - couponDiscount);
            actualDiscount = Math.min(discountAmount, couponAmount);
            actualPayment = originalAmount - actualDiscount;
          } else {
            // 金额券计算：只有达到使用门槛才能使用
            if (originalAmount >= minAmount) {
              actualDiscount = Math.min(fixedAmount, couponAmount);
              actualPayment = originalAmount - actualDiscount;
            } else {
              // 未达到使用门槛，不使用优惠券
              actualDiscount = 0;
              actualPayment = originalAmount;
            }
          }

          if (useType === 'single') {
            // 单次使用：无论抵扣多少，优惠券都消失
            remainingCouponAmount = 0;
          } else {
            // 多次使用：剩余可抵金额
            remainingCouponAmount = couponAmount - actualDiscount;
          }

          // 计算获得的蛋币和无门槛优惠券
          const eggCoins = tier.eggCoins;
          const coupons = getCoupons(actualPayment, isRebateDay);

          // 计算总价值
          let totalValue = eggCoins * defaultEggRate;
          if (isRebateDay) {
            totalValue += coupons * defaultCouponRate;
          }

          // 计算利润
          const profit = totalValue - actualPayment;

          // 计算折扣
          const newTotal = 0.1 * eggCoins + coupons;

                }
              });

              modalContent += `
                  </div>
                </div>
              `;
            }

            modalContent += `
                  <p>实际付款：<span class="value">${option.actualPayment.toFixed(2)}元</span></p>
                  <p>获得蛋币：<span class="value">${option.eggCoins}个</span></p>
                  <p>获得优惠券：<span class="value">${option.coupons}张</span></p>
                  <p>总价值：<span class="value">${option.totalValue.toFixed(2)}元</span></p>
                  <p>预估利润：<span class="value ${option.profit > 0 ? 'positive' : option.profit < 0 ? 'negative' : 'zero'}">${option.profit.toFixed(2)}元</span></p>
                  <p>实际折扣：<span class="value">${option.discount.toFixed(4)}折</span></p>
                  <p>剩余可抵金额：<span class="value">${option.remainingCouponAmount.toFixed(2)}元</span></p>
                </div>
              </div>
            `;
          });

          modalContent += `
            </div>
          `;

          // 创建模态框
          const modal = document.createElement('div');
          modal.id = 'result-modal';
          modal.className = 'modal';
          modal.innerHTML = `
            <div class="modal-content">
              ${modalContent}
            </div>
          `;

          // 添加到页面
          document.body.appendChild(modal);

          // 显示模态框
          setTimeout(() => {
            modal.classList.add('show');
          }, 10);

          // 关闭模态框函数
          window.closeModal = function () {
            modal.classList.remove('show');
            setTimeout(() => {
              document.body.removeChild(modal);
            }, 300);
          };

          // 点击模态框外部关闭
          modal.addEventListener('click', (e) => {
            if (e.target === modal) {
              modal.classList.remove('show');
              setTimeout(() => {
                document.body.removeChild(modal);
              }, 300);
            }
          });
        }
      } catch (error) {
        console.error('分析优惠券时出错:', error);
        alert('分析过程中出现错误，请检查控制台日志');
      }
    }

    // 计算自定义充值方案
    function calculateCustomPlan() {
      try {
        const rates = getAnalysisRates();
        if (!rates) return;
        const defaultEggRate = rates.eggRate;
        const defaultCouponRate = rates.couponRate;

        // 获取优惠券信息
        const couponType = document.querySelector('input[name="couponType"]:checked').value;
        const couponDiscount = parseFloat(document.getElementById('couponDiscount').value) || 0;
        const couponFixedAmount = parseFloat(document.getElementById('fixedAmount').value) || 0;
        const couponThreshold = parseFloat(document.getElementById('minAmount').value) || 0;
        let couponAmount = 0;
        if (couponType === 'discount') {
          couponAmount = parseFloat(document.getElementById('couponAmount').value) || 0;
        } else {
          couponAmount = couponFixedAmount;
        }
        const isRebateDay = document.querySelector('input[name="couponDayType"]:checked').value === 'rebate';

        // 获取自定义充值方案
        const customPlan1 = parseFloat(document.getElementById('customPlan1').value) || 0;
        const customPlan2 = parseFloat(document.getElementById('customPlan2').value) || 0;
        const customPlan3 = parseFloat(document.getElementById('customPlan3').value) || 0;

        // 收集有效充值金额
        const planAmounts = [customPlan1, customPlan2, customPlan3].filter(amount => amount > 0);

        if (planAmounts.length === 0) {
          alert('请至少填写一个充值金额');
          return;
        }

        // 计算结果
        let totalActualPayment = 0;
        let totalEggCoins = 0;
        let totalCoupons = 0;
        let remainingCoupon = couponAmount;
        const steps = [];

        // 计算每一步充值
        planAmounts.forEach((amount, index) => {
          // 找到对应的充值档位
          const tier = rechargeTiers.find(t => t.amount === amount) || {
            amount: amount,
            eggCoins: Math.floor(amount * 10) // 简单计算蛋币，实际应该根据档位计算
          };

          // 计算实际付款
          let actualPayment;
          if (couponType === 'discount') {
            // 折扣券
            const discountAmount = amount * (1 - couponDiscount);
            const actualDiscount = Math.min(discountAmount, remainingCoupon);
            actualPayment = amount - actualDiscount;
            remainingCoupon -= actualDiscount;
          } else {
            // 金额券
            if (amount >= couponThreshold) {
              actualPayment = amount - couponFixedAmount;
            } else {
              actualPayment = amount;
            }
          }

          // 计算获得的优惠券
          const coupons = getCoupons(actualPayment, isRebateDay);

          // 计算本次的折扣
          const stepNewTotal = 0.1 * tier.eggCoins + coupons;
          const stepDiscount = stepNewTotal > 0 ? actualPayment / stepNewTotal : 0;

          // 更新累计值
          totalActualPayment += actualPayment;
          totalEggCoins += tier.eggCoins;
          totalCoupons += coupons;

          // 保存步骤信息
          steps.push({
            amount: amount,
            actualPayment: actualPayment,
            eggCoins: tier.eggCoins,
            coupons: coupons,
            discount: stepDiscount,
            remainingCoupon: remainingCoupon
          });
        });

        // 计算总价值和利润
        let totalValue = totalEggCoins * defaultEggRate;
        if (isRebateDay) {
          totalValue += totalCoupons * defaultCouponRate;
        }
        const profit = totalValue - totalActualPayment;
        const overallDiscount = (0.1 * totalEggCoins + totalCoupons) > 0 ? totalActualPayment / (0.1 * totalEggCoins + totalCoupons) : 0;

        // 生成HTML内容
        let modalContent = `
          <div class="modal-header">
            <h3>📋 自定义充值方案分析</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="option-card">
              <div class="option-header">
                <span class="rank">自定义方案</span>
              </div>
              <div class="option-details">
                <p class="recharge-type">
                  组合充值：${planAmounts.join('元 + ')}元
                </p>
                <p>总充值金额：${planAmounts.reduce((a, b) => a + b, 0)}元</p>
        `;

        // 添加详细充值步骤
        if (steps.length > 1) {
          modalContent += `
            <div class="combination-steps">
              <h4>详细充值步骤：</h4>
              <div class="steps-container">
          `;

          steps.forEach((step, index) => {
            modalContent += `
              <div class="step-item">
                <h5>第${index + 1}步：${step.amount}元充值</h5>
                <p>实际付款：<span class="value">${step.actualPayment.toFixed(2)}元</span></p>
                <p>获得蛋币：<span class="value">${step.eggCoins}个</span></p>
                <p>获得优惠券：<span class="value">${step.coupons}张</span></p>
                <p>本次折扣：<span class="value">${step.discount.toFixed(4)}折</span></p>
                <p>剩余可抵金额：<span class="value">${step.remainingCoupon.toFixed(2)}元</span></p>
              </div>
            `;
          });

          modalContent += `
              </div>
            </div>
          `;
        }

        // 添加总结果
        modalContent += `
                <p>实际付款：<span class="value">${totalActualPayment.toFixed(2)}元</span></p>
                <p>获得蛋币：<span class="value">${totalEggCoins}个</span></p>
                <p>获得优惠券：<span class="value">${totalCoupons}张</span></p>
                <p>总价值：<span class="value">${totalValue.toFixed(2)}元</span></p>
                <p>预估利润：<span class="value ${profit > 0 ? 'positive' : profit < 0 ? 'negative' : 'zero'}">${profit.toFixed(2)}元</span></p>
                <p>实际折扣：<span class="value">${overallDiscount.toFixed(4)}折</span></p>
                <p>剩余可抵金额：<span class="value">${remainingCoupon.toFixed(2)}元</span></p>
              </div>
            </div>
          </div>
        `;

        // 创建模态框
        const modal = document.createElement('div');
        modal.id = 'custom-result-modal';
        modal.className = 'modal';
        modal.innerHTML = `
          <div class="modal-content">
            ${modalContent}
          </div>
        `;

        // 添加到页面
        document.body.appendChild(modal);

        // 显示模态框
        setTimeout(() => {
          modal.classList.add('show');
        }, 10);

        // 关闭模态框函数
        window.closeModal = function () {
          modal.classList.remove('show');
          setTimeout(() => {
            document.body.removeChild(modal);
          }, 300);
        };

        // 点击模态框外部关闭
        modal.addEventListener('click', (e) => {
          if (e.target === modal) {
            modal.classList.remove('show');
            setTimeout(() => {
              document.body.removeChild(modal);
            }, 300);
          }
        });

        // 更新结果显示
        document.getElementById('couponEggCoins').textContent = totalEggCoins + ' 蛋币';
        document.getElementById('couponCoupons').textContent = totalCoupons + ' 张';
        document.getElementById('couponTotalReturn').textContent = totalValue.toFixed(2) + ' 元';

        const profitElement = document.getElementById('couponProfit');
        profitElement.textContent = profit.toFixed(2) + ' 元';
        profitElement.classList.remove('profit-positive', 'profit-negative', 'profit-zero');
        if (profit > 0) {
          profitElement.classList.add('profit-positive');
        } else if (profit < 0) {
          profitElement.classList.add('profit-negative');
        } else {
          profitElement.classList.add('profit-zero');
        }

        document.getElementById('couponResultDiscount').textContent = overallDiscount.toFixed(4) + ' 折';

        // 显示结果
        const resultsDiv = document.getElementById('couponResults');
        resultsDiv.classList.add('show');
        document.getElementById('couponCouponItem').style.display = isRebateDay ? 'block' : 'none';

      } catch (error) {
        console.error('计算自定义方案时出错:', error);
        alert('计算过程中出现错误，请检查控制台日志');
      }
    }
  </script>
